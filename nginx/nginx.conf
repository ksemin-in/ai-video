worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 500M;   # allow large video uploads

    # ── Upstream ──────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # ── API & WebSocket ───────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 300s;   # long timeout for video processing
        }

        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400s;
        }

        location /docs    { proxy_pass http://backend; }
        location /redoc   { proxy_pass http://backend; }
        location /health  { proxy_pass http://backend; }
        location /openapi.json { proxy_pass http://backend; }

        # ── Health ────────────────────────────────────────────────
        location /ping {
            return 200 "pong\n";
            add_header Content-Type text/plain;
        }
    }
}
